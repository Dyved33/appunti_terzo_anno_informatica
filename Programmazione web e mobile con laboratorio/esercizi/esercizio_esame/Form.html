<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Page</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>LINUX <h1>

                <h2 >Un sistema. Infinite possibilità.</h2>

                <nav>
                    <a class="form-writings" href="Home.html">Homepage</a>
                    <a class="form-writings" href="Info.html">Distribuzioni</a>
                    <a class="form-writings" href="Form.html">Event Registration</a>
                </nav>
    </header>

    <main>
        <form class="form-grid" method="post">
            <div class="form-group">
                <label class="form-writings" for="firstname">Firstname:</label>
                <input type="text" id="firstname" name="firstname" required>
            </div>

            <div class="form-group">
                <label class="form-writings" for="lastname">Lastname:</label>
                <input type="text" id="lastname" name="lastname" required>
            </div>

            <div class="form-group">
                <label class="form-writings" for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label class="form-writings" for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-select">
                <label class="form-writings" for="topic">Topic:</label>
                <select id="topic" name="topic">
                    <option value="Select">-Select-</option> 
                    <option value="Architettura e Kernel">Architettura e Kernel</option>
                    <option value="Gestione Utenti e Sicurezza">Gestione Utenti e Sicurezza</option>
                    <option value="Shell e Scripting">Shell e Scripting</option>
                    <option value="File System e Archiviazione">File System e Archiviazione</option>
                    <option value="Gestione dei Pacchetti">Gestione dei Pacchetti</option>                    
                </select>
            </div>

            <div class="form-select">
                <label class="form-writings" for="pf">Preferred Slot:</label>
                <select id="pf" name="pf">
                    <option value="Select">-Select-</option>   
                    <option value="Aula conferenze">Aula conferenze</option>
                    <option value="Aula 2">Aula 2</option>
                    <option value="Aula 3">Aula 3</option>
                    <option value="Aula 4">Aula 4</option>
                    <option value="Aula 5">Aula 5</option>                    
                </select>
            </div>

            <div class="form-buttons">
                <input type=submit value="Sign me up">
                <button type="reset"
                    onclick="alert('Sei sicuro di voler resettare tutti i campi della form?')">Reset</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Il mio sito</p>
    </footer>
</body>

</html>
